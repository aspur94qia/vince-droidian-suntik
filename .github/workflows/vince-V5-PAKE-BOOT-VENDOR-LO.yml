name: Vince V5 PAKE BOOT VENDOR LO - AUTO FLASH
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pake boot vendor lo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y git zip brotli python3 -qq
          pip3 install -q sdat2img 2>/dev/null || true

          echo "=== 1. Download file lo dari Pixeldrain ==="
          # Link lo - gue coba semua format direct
          FILE_ID="z4pjqHVv"
          wget -q --show-progress "https://pixeldrain.com/api/file/$FILE_ID" -O vince-lo.zip
          ls -lh vince-lo.zip
          unzip -l vince-lo.zip | head -20

          echo "=== 2. Extract boot.img + vendor ==="
          unzip -o vince-lo.zip
          ls -lh boot.img vendor.new.dat.br vendor.transfer.list 2>/dev/null || true
          
          # Convert vendor.new.dat.br -> vendor.img
          if [ -f "vendor.new.dat.br" ]; then
            echo "Convert vendor.new.dat.br -> vendor.img ..."
            brotli -d vendor.new.dat.br -o vendor.new.dat || python3 -m brotli -d vendor.new.dat.br -o vendor.new.dat
            ls -lh vendor.new.dat
            # sdat2img
            wget -q https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py -O sdat2img.py
            python3 sdat2img.py vendor.transfer.list vendor.new.dat vendor-vince-A13-832M-KOMPLIT.img
            ls -lh vendor-vince-A13-832M-KOMPLIT.img
          else
            echo "vendor.new.dat.br tidak ada, cari vendor.img langsung"
            ls -lh *.img
          fi
          ls -lh boot.img vendor*.img

          echo "=== 3. GSI Droidian ==="
          wget -q "https://github.com/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api33-arm64-101.20251130_20251207.zip" -O gsi.zip
          unzip -q gsi.zip

          echo "=== 4. PACK V5 - BOOT VENDOR LO + AUTO FLASH ==="
          rm -rf FINAL && mkdir -p FINAL/data FINAL/META-INF/com/google/android FINAL/KOMPLIT/var/lib/droidian-adaptation FINAL/KOMPLIT/etc/droidian-adaptation
          cp data/rootfs.img FINAL/data/
          cp boot.img FINAL/KOMPLIT/boot.img
          cp vendor-vince-A13-832M-KOMPLIT.img FINAL/KOMPLIT/vendor.img
          cp adaptation-vince-4.9-api33.deb FINAL/KOMPLIT/var/lib/droidian-adaptation/
          dpkg-deb -x adaptation-vince-4.9-api33.deb /tmp/deb/ && cp -r /tmp/deb/etc/droidian-adaptation/* FINAL/KOMPLIT/etc/droidian-adaptation/ 2>/dev/null || true

          cat > FINAL/META-INF/com/google/android/updater-script << 'EOS'
          ui_print("==========================================");
          ui_print("VINCE V5 - BOOT+VENDOR LO SENDIRI");
          ui_print("boot.img -> /boot");
          ui_print("vendor.img -> /vendor");
          ui_print("rootfs.img -> /userdata");
          ui_print("==========================================");
          package_extract_file("KOMPLIT/boot.img", "/dev/block/bootdevice/by-name/boot");
          package_extract_file("KOMPLIT/vendor.img", "/dev/block/bootdevice/by-name/vendor");
          package_extract_file("data/rootfs.img", "/dev/block/bootdevice/by-name/userdata");
          ui_print("V5 SELESAI - REBOOT DROIDIAN");
          EOS

          cat FINAL/META-INF/com/google/android/updater-script
          cd FINAL && zip -r -9 ../droidian-vince-V5-BOOT-VENDOR-LO-AUTO-FLASH.zip data/ META-INF/ KOMPLIT/
          cd .. && ls -lh droidian-vince-V5-*.zip
          unzip -l droidian-vince-V5-BOOT-VENDOR-LO-AUTO-FLASH.zip | grep -E "boot.img|vendor.img|rootfs|updater-script"

      - uses: actions/upload-artifact@v4
        with:
          name: vince-V5-BOOT-VENDOR-LO
          path: droidian-vince-V5-BOOT-VENDOR-LO-AUTO-FLASH.zip
