name: Vince V4 FIX AUTO FLASH PARTISI
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FIX AUTO FLASH
        run: |
          sudo apt-get update -qq && sudo apt-get install -y git zip python3 cpio -qq
          echo "=== 1. GSI ==="
          wget -q "https://github.com/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api33-arm64-101.20251130_20251207.zip" -O gsi.zip
          unzip -q gsi.zip

          echo "=== 2. Ambil boot.img halium 13 prebuilt (anti fail compile) ==="
          # ambil boot.img dari LineageOS 20 vince official + extract kernel Image.gz-dtb
          wget -q --show-progress "https://mirrorbits.lineageos.org/full/vince/20231215/lineage-20.0-20231215-nightly-vince-signed.zip" -O los.zip || wget -q "https://github.com/LineageOS/android_kernel_xiaomi_msm8953/releases/download/lineage-20/Image.gz-dtb" -O Image.gz-dtb || echo "los fail, pakai kernel prebuilt dari adaptation"
          unzip -q los.zip boot.img 2>/dev/null || echo "boot.img LOS tidak ada, download kernel langsung"
          # fallback download kernel Image.gz-dtb dari kernel build artifacts Vince-Beast
          if [ ! -f "Image.gz-dtb" ]; then
            wget -q "https://github.com/Vince-Beast/android_kernel_xiaomi_msm8953/releases/download/kernel-vince-4.9/Image.gz-dtb" -O Image.gz-dtb || \
            wget -q "https://raw.githubusercontent.com/droidian-vince/device-adaptation-vince/main/boot/Image.gz-dtb" -O Image.gz-dtb || \
            cp boot.img Image.gz-dtb 2>/dev/null || echo "akan pakai boot.img LOS sebagai boot halium"
          fi
          ls -lh boot.img Image.gz-dtb 2>/dev/null || true

          # bikin boot halium final
          wget -q https://github.com/osm0sis/mkbootimg/releases/download/v2023.12.08/mkbootimg -O mkbootimg && chmod +x mkbootimg
          if [ -f "Image.gz-dtb" ]; then
            echo -n | gzip > ramdisk.cpio.gz
            ./mkbootimg --kernel Image.gz-dtb --ramdisk ramdisk.cpio.gz --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom androidboot.console=ttyMSM0" -o boot-vince-halium13-4.9-832M.img
          else
            cp boot.img boot-vince-halium13-4.9-832M.img
          fi
          ls -lh boot-vince-halium13-4.9-832M.img

          echo "=== 3. Build vendor.img A13-832M ==="
          git clone --depth 1 https://github.com/Vince-Beast/vendor_xiaomi.git vendor-a13
          rm -f vendor-vince-A13-832M.img && truncate -s 1G vendor-vince-A13-832M.img && mkfs.ext4 -F -L vendor vendor-vince-A13-832M.img
          mkdir -p /tmp/vm && sudo mount -o loop vendor-vince-A13-832M.img /tmp/vm && sudo cp -rf vendor-a13/* /tmp/vm/ && sudo umount /tmp/vm

          echo "=== 4. PACK V4 FIX AUTO FLASH KE PARTISI ==="
          rm -rf FINAL && mkdir -p FINAL/data FINAL/META-INF/com/google/android FINAL/KOMPLIT/var/lib/droidian-adaptation FINAL/KOMPLIT/etc/droidian-adaptation
          cp data/rootfs.img FINAL/data/
          cp boot-vince-halium13-4.9-832M.img FINAL/KOMPLIT/boot.img
          cp vendor-vince-A13-832M.img FINAL/KOMPLIT/vendor.img
          cp adaptation-vince-4.9-api33.deb FINAL/KOMPLIT/var/lib/droidian-adaptation/
          dpkg-deb -x adaptation-vince-4.9-api33.deb /tmp/deb/ && cp -r /tmp/deb/etc/droidian-adaptation/* FINAL/KOMPLIT/etc/droidian-adaptation/ 2>/dev/null || true

          cat > FINAL/META-INF/com/google/android/updater-script << 'EOS'
          ui_print("==========================================");
          ui_print("VINCE V4 FIX - AUTO FLASH PARTISI");
          ui_print("boot.img -> /boot | vendor.img -> /vendor");
          ui_print("rootfs.img -> /userdata - INGAT REQUEST");
          ui_print("==========================================");
          ui_print("Flash BOOT halium 13 ke /boot ...");
          package_extract_file("KOMPLIT/boot.img", "/dev/block/bootdevice/by-name/boot");
          ui_print("Flash VENDOR A13-832M ke /vendor ...");
          package_extract_file("KOMPLIT/vendor.img", "/dev/block/bootdevice/by-name/vendor");
          ui_print("Flash ROOTFS ke /userdata ...");
          package_extract_file("data/rootfs.img", "/dev/block/bootdevice/by-name/userdata");
          ui_print("Selesai - Reboot Droidian");
          EOS

          cd FINAL && zip -r -9 ../droidian-vince-V4-FIX-AUTO-FLASH-boot-vendor-userdata.zip data/ META-INF/ KOMPLIT/
          cd .. && ls -lh *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vince-V4-FIX-AUTO-FLASH
          path: droidian-vince-V4-FIX-AUTO-FLASH-boot-vendor-userdata.zip
