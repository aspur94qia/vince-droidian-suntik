name: Vince V3 KOMPLIT ALL boot+vendor+rootfs
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ALL Komplit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git zip bc bison flex libssl-dev libelf-dev build-essential gcc-aarch64-linux-gnu python3 cpio -qq

          echo "=== 1. GSI Droidian 101.20251130 ==="
          wget -q --show-progress "https://github.com/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api33-arm64-101.20251130_20251207.zip" -O gsi.zip
          unzip -q gsi.zip
          ls -lh data/rootfs.img

          echo "=== 2. Clone + Build kernel 4.9.377 Unitrix ==="
          git clone --depth 1 https://github.com/LineageOS/android_kernel_xiaomi_msm8953.git -b lineage-20 kernel
          cd kernel
          export ARCH=arm64 && export CROSS_COMPILE=aarch64-linux-gnu- && make vince_defconfig
          make -j$(nproc) Image.gz-dtb 2>&1 | tail -30
          ls -lh arch/arm64/boot/Image.gz-dtb
          cd ..

          echo "=== 3. Build vendor.img A13-832M KOMPLIT ==="
          git clone --depth 1 https://github.com/Vince-Beast/vendor_xiaomi.git vendor-a13
          rm -f vendor-vince-A13-832M-KOMPLIT.img
          truncate -s 1G vendor-vince-A13-832M-KOMPLIT.img
          mkfs.ext4 -F -L vendor vendor-vince-A13-832M-KOMPLIT.img
          mkdir -p /tmp/vm && sudo mount -o loop vendor-vince-A13-832M-KOMPLIT.img /tmp/vm
          sudo cp -rf vendor-a13/* /tmp/vm/
          # Tambah overlay halium
          sudo mkdir -p /tmp/vm/etc/droidian-adaptation /tmp/vm/lib/firmware
          echo "vince 4.9 A13-832M halium-13 api33" | sudo tee /tmp/vm/etc/droidian-adaptation/deviceinfo
          sudo umount /tmp/vm
          ls -lh vendor-vince-A13-832M-KOMPLIT.img

          echo "=== 4. Build boot.img halium 13 KOMPLIT ==="
          wget -q https://github.com/osm0sis/mkbootimg/releases/download/v2023.12.08/mkbootimg -O mkbootimg && chmod +x mkbootimg
          # ramdisk halium kosong minimal
          echo -n | gzip > ramdisk.cpio.gz
          ./mkbootimg --kernel kernel/arch/arm64/boot/Image.gz-dtb --ramdisk ramdisk.cpio.gz --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.configfs=true" -o boot-vince-halium13-4.9-832M-KOMPLIT.img
          ls -lh boot-vince-halium13-*.img

          echo "=== 5. Pack FINAL KOMPLIT ALL ==="
          rm -rf FINAL && mkdir -p FINAL/data FINAL/META-INF/com/google/android FINAL/KOMPLIT
          cp data/rootfs.img FINAL/data/
          cp -r META-INF/* FINAL/META-INF/ 2>/dev/null || true
          
          # BOOT + VENDOR KOMPLIT
          cp boot-vince-halium13-4.9-832M-KOMPLIT.img FINAL/KOMPLIT/boot.img
          cp vendor-vince-A13-832M-KOMPLIT.img FINAL/KOMPLIT/vendor.img
          
          # DEB 856 byte SUNTIK BENER
          cp adaptation-vince-4.9-api33.deb FINAL/KOMPLIT/
          mkdir -p FINAL/KOMPLIT/var/lib/droidian-adaptation FINAL/KOMPLIT/etc/droidian-adaptation
          cp adaptation-vince-4.9-api33.deb FINAL/KOMPLIT/var/lib/droidian-adaptation/
          dpkg-deb -x adaptation-vince-4.9-api33.deb /tmp/deb/
          cp -r /tmp/deb/etc/droidian-adaptation/* FINAL/KOMPLIT/etc/droidian-adaptation/ 2>/dev/null || true
          
          # Info
          echo "VINCE 4.9 A13-832M HALIUM13 KOMPLIT - BOOT+VENDOR+ROOTFS+DEB 856byte" > FINAL/KOMPLIT/README-KOMPLIT.txt
          dpkg-deb -c adaptation-vince-4.9-api33.deb >> FINAL/KOMPLIT/README-KOMPLIT.txt
          
          # Zip final
          cd FINAL && zip -r -9 ../droidian-vince-V3-KOMPLIT-ALL-boot-vendor-rootfs-deb.zip data/ META-INF/ KOMPLIT/
          cd .. && ls -lh droidian-vince-V3-KOMPLIT-ALL-*.zip
          echo "=== VERIFIKASI KOMPLIT ==="
          unzip -l droidian-vince-V3-KOMPLIT-ALL-boot-vendor-rootfs-deb.zip | grep -E "boot.img|vendor.img|adaptation-vince|deviceinfo|README"

      - uses: actions/upload-artifact@v4
        with:
          name: vince-V3-KOMPLIT-ALL
          path: |
            boot-vince-halium13-4.9-832M-KOMPLIT.img
            vendor-vince-A13-832M-KOMPLIT.img
            droidian-vince-V3-KOMPLIT-ALL-boot-vendor-rootfs-deb.zip
