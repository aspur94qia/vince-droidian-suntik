name: Suntik Vince 4.9 api33
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rootfs latest
        run: |
          curl -s https://images.droidian.org/rootfs-api33/ -o index.html
          LATEST=$(grep -o 'droidian-rootfs-api33-phosh-arm64[^"]*\.zip' index.html | sort -V | tail -1)
          echo "Latest file: $LATEST"
          wget -q https://images.droidian.org/rootfs-api33/$LATEST -O rootfs.zip
          ls -lh rootfs.zip
      - name: Suntik deb asli hp
        run: |
          ls -lh *.deb rootfs.zip
          rm -rf work && mkdir work
          cd work
          unzip -q ../rootfs.zip
          mkdir -p var/lib/droidian-adaptation/
          cp ../adaptation-vince-4.9-api33.deb var/lib/droidian-adaptation/
          mkdir -p inject
          dpkg-deb -x ../adaptation-vince-4.9-api33.deb inject/
          cp -r inject/etc/* etc/ 2>/dev/null || true
          cd ..
          zip -r -q droidian-vince-4.9-api33-FINAL-SUNTIK.zip work
          ls -lh *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: droidian-vince-4.9-api33-FINAL
          path: droidian-vince-4.9-api33-FINAL-SUNTIK.zip
