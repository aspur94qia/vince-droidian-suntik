name: Suntik Vince 4.9 api33
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rootfs STABLE PHOSH FULL (bukan devtools)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y jq -qq
          curl -s https://api.github.com/repos/droidian-images/droidian/releases?per_page=20 > rel.json
          echo "=== semua asset stable ==="
          jq -r '.[] | select(.prerelease==false) | .assets[].browser_download_url' rel.json | grep -i zip | head -20
          # cari yang phosh + arm64 + api28/33 tapi BUKAN devtools
          URL=$(jq -r '.[] | select(.prerelease==false) | .assets[].browser_download_url' rel.json | grep -i "phosh" | grep -i "arm64" | grep -iv "devtools" | grep -i "\.zip" | head -1)
          echo "URL FULL PHOSH: $URL"
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            URL=$(jq -r '.[] | select(.prerelease==false) | .assets[].browser_download_url' rel.json | grep -i "\.zip" | grep -iv "devtools" | head -1)
            echo "Fallback: $URL"
          fi
          wget -q --show-progress "$URL" -O rootfs-original.zip
          ls -lh rootfs-original.zip
          du -h rootfs-original.zip
      - name: Suntik deb asli 856 byte tanpa unzip full
        run: |
          ls -lh *.deb
          # bikin struktur inject
          rm -rf inject && mkdir -p inject/var/lib/droidian-adaptation
          cp adaptation-vince-4.9-api33.deb inject/var/lib/droidian-adaptation/
          mkdir -p inject/etc
          dpkg-deb -x adaptation-vince-4.9-api33.deb inject-tmp/
          cp -r inject-tmp/etc/* inject/etc/ 2>/dev/null || true
          # copy original jadi FINAL dan tambahin file inject langsung ke zip nya
          cp rootfs-original.zip droidian-vince-4.9-api33-FINAL-SUNTIK.zip
          cd inject
          zip -r -g ../droidian-vince-4.9-api33-FINAL-SUNTIK.zip var/lib/droidian-adaptation/ etc/ 2>/dev/null || zip -r -g ../droidian-vince-4.9-api33-FINAL-SUNTIK.zip var/
          cd ..
          ls -lh *.zip
          echo "FINAL size harus 600MB+"
      - uses: actions/upload-artifact@v4
        with:
          name: droidian-vince-4.9-api33-FINAL
          path: droidian-vince-4.9-api33-FINAL-SUNTIK.zip
