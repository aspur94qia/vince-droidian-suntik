name: Suntik Vince 4.9 api33
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download link resmi dari bos 101.20251130
        run: |
          echo "Download dari link bos..."
          wget -q --show-progress "https://github.com/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api33-arm64-101.20251130_20251207.zip" -O rootfs-original.zip
          ls -lh rootfs-original.zip
          echo "Harus 600MB+ kalo bener"
      - name: Suntik deb asli 856 byte
        run: |
          ls -lh *.deb rootfs-original.zip
          rm -rf inject inject-tmp
          mkdir -p inject/var/lib/droidian-adaptation
          cp adaptation-vince-4.9-api33.deb inject/var/lib/droidian-adaptation/
          mkdir -p inject-tmp && dpkg-deb -x adaptation-vince-4.9-api33.deb inject-tmp/
          mkdir -p inject/etc
          cp -r inject-tmp/etc/* inject/etc/ 2>/dev/null || echo "no etc"
          # inject ke zip original tanpa extract full
          cp rootfs-original.zip droidian-vince-4.9-api33-FINAL-SUNTIK.zip
          cd inject
          zip -r -g ../droidian-vince-4.9-api33-FINAL-SUNTIK.zip var/lib/droidian-adaptation/ etc/ 2>/dev/null || zip -r -g ../droidian-vince-4.9-api33-FINAL-SUNTIK.zip var/
          cd ..
          ls -lh droidian-vince-4.9-api33-FINAL-SUNTIK.zip
      - uses: actions/upload-artifact@v4
        with:
          name: droidian-vince-4.9-api33-FINAL
          path: droidian-vince-4.9-api33-FINAL-SUNTIK.zip
