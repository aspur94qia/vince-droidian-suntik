name: Suntik Vince 4.9 api33
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt update && sudo apt install wget zip -y
      - run: wget -q https://images.droidian.org/rootfs-api33/droidian-rootfs-api33-phosh-arm64.zip -O rootfs.zip || wget -q https://images.droidian.org/rootfs-api33/droidian-rootfs-api33-phosh-arm64-20241021.zip -O rootfs.zip
      - run: ls -lh *.deb rootfs.zip
      - run: |
          rm -rf work && mkdir work && cd work
          unzip -q ../rootfs.zip
          mkdir -p var/lib/droidian-adaptation/
          mkdir -p Droidian/var/lib/droidian-adaptation/ 2>/dev/null || true
          cp ../adaptation-vince-4.9-api33.deb var/lib/droidian-adaptation/
          cp ../adaptation-vince-4.9-api33.deb Droidian/var/lib/droidian-adaptation/ 2>/dev/null || true
          mkdir inject && dpkg-deb -x ../adaptation-vince-4.9-api33.deb inject/
          cp -r inject/etc/* etc/ 2>/dev/null || true
          cp -r inject/etc/* Droidian/etc/ 2>/dev/null || true
          zip -r ../droidian-vince-4.9-api33-FINAL-SUNTIK.zip . -q
          cd .. && ls -lh *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: droidian-vince-4.9-api33-FINAL
          path: droidian-vince-4.9-api33-FINAL-SUNTIK.zip
