name: BUILD NO APT UPDATE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "=== NO APT UPDATE - LANGSUNG BUILD ==="
          wget -q "https://pixeldrain.com/api/file/z4pjqHVv?download" -O lo.zip || wget -q "https://pixeldrain.com/api/file/z4pjqHVv" -O lo.zip
          unzip -o -q lo.zip; rm -rf META-INF data
          
          # VENDOR BUILD - tanpa simg2img dari apt, pake python
          python3 -c "import brotli; open('vendor.new.dat','wb').write(brotli.decompress(open('vendor.new.dat.br','rb').read()))" || pip3 install brotli -q && python3 -c "import brotli; open('vendor.new.dat','wb').write(brotli.decompress(open('vendor.new.dat.br','rb').read()))"
          wget -q https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py -O s.py
          python3 s.py vendor.transfer.list vendor.new.dat v.img
          # simg2img manual - download binary
          wget -q https://github.com/Klajdi94/simg2img/releases/download/v1.0/simg2img -O simg2img || wget -q https://github.com/anestisb/android-simg2img/releases/download/v1.1.6/simg2img -O simg2img
          chmod +x simg2img; ./simg2img v.img r.img 2>/dev/null || cp v.img r.img
          mkdir m && sudo mount -o loop r.img m || true
          rm -rf vn && mkdir vn && sudo cp -a m/* vn/ 2>/dev/null || cp -a m/* vn/; sudo umount m || true
          mkdir -p vn/etc/init && echo "on early-fs
              mkdir /data/lxc 0755 root root" > vn/etc/init/halium.rc
          truncate -s 832M vendor-HALIUM.img && mkfs.ext4 -F -d vn vendor-HALIUM.img
          wget -q https://github.com/anestisb/android-simg2img/releases/download/v1.1.6/img2simg -O img2simg; chmod +x img2simg; ./img2simg vendor-HALIUM.img vendor-s.img && mv vendor-s.img vendor-HALIUM.img || true

          # BOOT BUILD - tanpa apt
          git clone --depth 1 https://github.com/Vince-Beast/android_kernel_xiaomi_msm8953.git -b lineage-20 k
          cd k; export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-; make vince_defconfig; make -j$(nproc) Image.gz-dtb; cd ..
          wget -q https://github.com/osm0sis/mkbootimg/releases/download/v2023.12.08/mkbootimg -O mki && chmod +x mki
          echo -n | gzip > ram.gz
          ./mki --kernel k/arch/arm64/boot/Image.gz-dtb --ramdisk ram.gz --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom androidboot.bootdevice=7824900.sdhci androidboot.selinux=permissive" -o boot-HALIUM.img

          # PACK
          wget -q https://github.com/droidian-images/droidian/releases/download/droidian%2F101.20251130/droidian-OFFICIAL-phosh-phone-rootfs-api33-arm64-101.20251130_20251207.zip -O g.zip && unzip -o -q g.zip
          rm -rf F && mkdir -p F/data F/META-INF/com/google/android F/HALIUM
          cp data/rootfs.img F/data/; cp boot-HALIUM.img F/HALIUM/boot.img; cp vendor-HALIUM.img F/HALIUM/vendor.img
          echo 'ui_print("NO APT - BOOT VENDOR LO JADI HALIUM"); package_extract_file("HALIUM/boot.img","/dev/block/bootdevice/by-name/boot"); package_extract_file("HALIUM/vendor.img","/dev/block/bootdevice/by-name/vendor"); package_extract_file("data/rootfs.img","/dev/block/bootdevice/by-name/userdata");' > F/META-INF/com/google/android/updater-script
          cd F && zip -r -9 ../droidian-NO-APT.zip data/ META-INF/ HALIUM/

      - uses: actions/upload-artifact@v4
        with: {name: NO-APT-HALIUM, path: droidian-NO-APT.zip}
